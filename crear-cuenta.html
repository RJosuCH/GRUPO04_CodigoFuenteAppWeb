<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Crear cuenta | FERREMAS</title>
    <link rel="stylesheet" href="css/acceso.css">
</head>

<body class="acceso-body">

    <a href="index.html" class="volver-inicio">
        ← Volver a la página principal
    </a>

    <main class="acceso-contenedor">
        <section class="acceso-tarjeta">

            <div class="acceso-logo">FERRE<span>MAS</span></div>

            <h1>Crear una cuenta</h1>

            <p class="acceso-descripcion">
                Regístrate para disfrutar de nuestros productos y servicios.
            </p>

            <form id="formRegistro">

                <div class="campo">
                    <label for="nombre">Nombre completo</label>
                    <input type="text" id="nombre"
                        placeholder="Ingresa tu nombre completo" required>
                </div>

                <div class="campo">
                    <label for="correo">Correo electrónico</label>
                    <input type="email" id="correo"
                        placeholder="ejemplo@correo.com" required>
                </div>

                <div class="campo">
                    <label for="telefono">Teléfono</label>
                    <input type="tel" id="telefono"
                        placeholder="Ingresa tu número de teléfono"
                        required>
                </div>

                <div class="campo">
                    <label for="passwordRegistro">Contraseña</label>
                    <div class="contrasena-contenedor">
                        <input type="password" id="passwordRegistro"
                            placeholder="Crea una contraseña" required>
                        <button type="button" class="mostrar-password"
                            onclick="mostrarPassword('passwordRegistro', this)">
                            Mostrar
                        </button>
                    </div>
                </div>

                <div class="campo">
                    <label for="confirmarPassword">Confirmar contraseña</label>
                    <div class="contrasena-contenedor">
                        <input type="password" id="confirmarPassword"
                            placeholder="Repite tu contraseña" required>
                        <button type="button" class="mostrar-password"
                            onclick="mostrarPassword('confirmarPassword', this)">
                            Mostrar
                        </button>
                    </div>
                </div>

                <button type="submit" class="btn-acceso">
                    Crear cuenta
                </button>

            </form>

            <div class="separador"></div>

            <p class="acceso-alternativo">
                ¿Ya tienes una cuenta?
                <a href="iniciosesion.html">Iniciar sesión</a>
            </p>

        </section>
    </main>

    <script src="js/crear-cuenta.js"></script>
</body>
</html>
